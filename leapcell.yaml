# Leapcell configuration for YouTube Shorts API
service:
  name: youtube-shorts-generator
  runtime: python
  port: 8080

build:
  # Install FFmpeg + fonts for text overlay support [[1]]
  command: |
    apt-get update && apt-get install -y \
      ffmpeg \
      fonts-dejavu-core \
      && pip install -r requirements.txt

start:
  # Single worker for memory efficiency, 120s timeout for video rendering
  command: gunicorn -w 1 -b :8080 --timeout 120 app:app

env:
  PYTHONUNBUFFERED: "1"
  FFMPEG_LOG_LEVEL: "warning"

resources:
  # Recommend 1GB RAM minimum for FFmpeg processing
  memory: 1Gi